[project]
name = "secure-commerce"
version = "0.1.0"
description = "Secure Django commerce platform"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "Django>=5.2,<6.1",
    "djangorestframework>=3.18,<3.19",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "gunicorn>=23,<24",
    "reportlab>=4.4,<5",
    "redis>=5,<7",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.django-stubs]
django_settings_module = "config.settings.development"
